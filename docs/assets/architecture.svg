<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">OTOP Chiang Mai architecture</title><desc id="desc">Seed data and optional Supabase published rows feed a static Next.js storefront. A localhost form calls Express. Optional LINE and Telegram adapters enqueue AI jobs for Gemini extraction; the server writes products to Supabase.</desc><rect width="1200" height="640" fill="#f5f0e8"/><g font-family="Arial,Helvetica,sans-serif" fill="#1a1410"><text x="48" y="54" font-size="15" fill="#8a5400" letter-spacing="2">DEMO FIRST / SERVICES OPTIONAL</text><text x="48" y="102" font-size="34" font-weight="700">Three paths into the catalogue</text><rect x="48" y="164" width="300" height="166" fill="#f5f0e8" stroke="#c6bfb3"/><text x="68" y="193" font-size="12" fill="#645d53" letter-spacing="2">01 / DEFAULT</text><text x="68" y="228" font-size="22" fill="#1a1410" font-weight="700">Seed catalogue</text><text x="68" y="260" font-size="15" fill="#1a1410" >seed-data.ts</text><text x="68" y="284" font-size="15" fill="#1a1410" >12 products + sample reviews</text><text x="68" y="308" font-size="15" fill="#1a1410" >No credentials required</text><rect x="444" y="164" width="312" height="166" fill="#f5f0e8" stroke="#f59e0b"/><text x="464" y="193" font-size="12" fill="#f59e0b" letter-spacing="2">02 / DISPLAY</text><text x="464" y="228" font-size="22" fill="#1a1410" font-weight="700">Next.js storefront</text><text x="464" y="260" font-size="15" fill="#1a1410" >useCatalogue + catalog.ts</text><text x="464" y="284" font-size="15" fill="#1a1410" >Seed + published live rows</text><text x="464" y="308" font-size="15" fill="#1a1410" >Static export: web/out</text><rect x="852" y="164" width="300" height="166" fill="#f5f0e8" stroke="#c6bfb3"/><text x="872" y="193" font-size="12" fill="#645d53" letter-spacing="2">03 / OPTIONAL DATABASE</text><text x="872" y="228" font-size="22" fill="#1a1410" font-weight="700">Supabase</text><text x="872" y="260" font-size="15" fill="#1a1410" >products + categories + districts</text><text x="872" y="284" font-size="15" fill="#1a1410" >Browser: public read key</text><text x="872" y="308" font-size="15" fill="#1a1410" >Bot: server-only service key</text><path d="M348 247H444" fill="none" stroke="#8a5400" stroke-width="2"/><path d="M437 242l7 5-7 5" fill="none" stroke="#8a5400" stroke-width="2"/><path d="M852 247H756" fill="none" stroke="#8a5400" stroke-width="2"/><path d="M763 242l-7 5 7 5" fill="none" stroke="#8a5400" stroke-width="2"/><rect x="48" y="404" width="300" height="166" fill="#f5f0e8" stroke="#c6bfb3"/><text x="68" y="433" font-size="12" fill="#645d53" letter-spacing="2">LOCAL / DEVELOPMENT</text><text x="68" y="468" font-size="22" fill="#1a1410" font-weight="700">Local seller form</text><text x="68" y="500" font-size="15" fill="#1a1410" >localhost /submit</text><text x="68" y="524" font-size="15" fill="#1a1410" >POST 127.0.0.1:3001/listings</text><text x="68" y="548" font-size="15" fill="#1a1410" >Manual listing + contact</text><rect x="444" y="404" width="312" height="166" fill="#f5f0e8" stroke="#c6bfb3"/><text x="464" y="433" font-size="12" fill="#645d53" letter-spacing="2">OPTIONAL / SERVER</text><text x="464" y="468" font-size="22" fill="#1a1410" font-weight="700">Express bot process</text><text x="464" y="500" font-size="15" fill="#1a1410" >/listings → product insert</text><text x="464" y="524" font-size="15" fill="#1a1410" >Chat → inbox → ai_jobs</text><text x="464" y="548" font-size="15" fill="#1a1410" >Worker → Gemini → product</text><rect x="852" y="404" width="300" height="166" fill="#f5f0e8" stroke="#c6bfb3"/><text x="872" y="433" font-size="12" fill="#645d53" letter-spacing="2">OPTIONAL / EXTERNAL</text><text x="872" y="468" font-size="22" fill="#1a1410" font-weight="700">LINE + Telegram</text><text x="872" y="500" font-size="15" fill="#1a1410" >Credential-gated adapters</text><text x="872" y="524" font-size="15" fill="#1a1410" >External calls + seller replies</text><text x="872" y="548" font-size="15" fill="#1a1410" >Not turnkey production</text><path d="M348 487H444" fill="none" stroke="#8a5400" stroke-width="2"/><path d="M437 482l7 5-7 5" fill="none" stroke="#8a5400" stroke-width="2"/><path d="M852 487H756" fill="none" stroke="#8a5400" stroke-width="2"/><path d="M763 482l-7 5 7 5" fill="none" stroke="#8a5400" stroke-width="2"/><path d="M600 404v-42h402v-32" fill="none" stroke="#8a5400" stroke-width="2"/><path d="M997 337l5-7 5 7" fill="none" stroke="#8a5400" stroke-width="2"/><text x="48" y="618" font-size="16" fill="#645d53" >The seed analytics remain illustrative even when the catalogue reads local listings.</text></g></svg>
